name: Deploy frontend to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      BACKEND_URL: ${{ vars.BACKEND_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      APP_BUILD_ID: ${{ github.sha }}
      OBSERVABILITY_INGEST_URL: ${{ vars.OBSERVABILITY_INGEST_URL }}
      OBSERVABILITY_ALLOWED_ORIGINS: ${{ vars.OBSERVABILITY_ALLOWED_ORIGINS }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - name: Validate production configuration
        env:
          OBSERVABILITY_INGEST_TOKEN: ${{ secrets.OBSERVABILITY_INGEST_TOKEN }}
        run: |
          test -n "$BACKEND_URL" && test -n "$NEXT_PUBLIC_SUPABASE_URL" && test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          if [ -n "$OBSERVABILITY_INGEST_URL" ] || [ -n "$OBSERVABILITY_ALLOWED_ORIGINS" ] || [ -n "$OBSERVABILITY_INGEST_TOKEN" ]; then
            test -n "$OBSERVABILITY_INGEST_URL" && test -n "$OBSERVABILITY_ALLOWED_ORIGINS" && test -n "$OBSERVABILITY_INGEST_TOKEN"
          fi
      - run: bun run typecheck
      - run: bun test
      - name: Inject non-secret Worker observability variables
        run: bun scripts/configure-observability-deploy.ts wrangler.jsonc
      - run: bun run build:vinext
      - name: Configure server-only observability secret
        if: ${{ vars.OBSERVABILITY_INGEST_URL != '' }}
        env:
          OBSERVABILITY_INGEST_TOKEN: ${{ secrets.OBSERVABILITY_INGEST_TOKEN }}
        run: |
          if rg --quiet --fixed-strings -- "$OBSERVABILITY_INGEST_TOKEN" dist; then echo 'observability secret leaked into build' >&2; exit 1; fi
          printf '%s' "$OBSERVABILITY_INGEST_TOKEN" | bun x wrangler secret put OBSERVABILITY_INGEST_TOKEN --config dist/server/wrangler.json
      - run: bun run deploy:vinext
